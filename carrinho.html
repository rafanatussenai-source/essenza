<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESSENZA | Carrinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="produtos.css">

    <link rel="stylesheet" href="carrinho.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="menu-navbar">

            <a class="navbar-brand" href="index.html">

                <img src="essenza-flor-logo.png" alt="ESSENZA">

            </a>

            <ul class="menu-links">

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="produtos.html">Produtos</a>
                </li>

                <li>
                    <a href="sobre.html">Sobre nós</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>

                <li>
                    <a href="carrinho.html" class="link-carrinho">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg>
                        Carrinho
                        <span id="contador-carrinho">0</span>
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <section class="titulo-produtos">

        <p>ESSENZA</p>

        <h1>Meu Carrinho</h1>

        <p>
            Confira os produtos escolhidos por você.
        </p>

    </section>

    <section class="carrinho-pagina">

        <div class="carrinho-layout">

            <div class="carrinho-itens" id="lista-carrinho"></div>

            <aside class="carrinho-resumo">

                <h3>Resumo do pedido</h3>

                <div class="resumo-linha">
                    <span>Itens</span>
                    <span id="resumo-itens">0</span>
                </div>

                <div class="resumo-linha resumo-total">
                    <span>Total</span>
                    <span>R$ <span id="total-carrinho">0,00</span></span>
                </div>

                <button class="btn btn-primary w-100" onclick="finalizarCompra()">
                    Finalizar compra
                </button>

                <a href="produtos.html" class="continuar-comprando">Continuar comprando</a>

            </aside>

        </div>

    </section>

    <section id="pagamento" class="pagamento-box">

        <h2>Finalizar pedido</h2>

        <p class="pagamento-subtitulo">
            Escolha sua forma de pagamento.
        </p>

        <div class="forma-pagamento">

            <button
                id="btn-pix"
                onclick="selecionarPagamento('pix')">

                Pix

            </button>

            <button
                id="btn-boleto"
                onclick="selecionarPagamento('boleto')">

                Boleto

            </button>

            <button
                id="btn-credito"
                onclick="selecionarPagamento('credito')">

                Cartão de crédito

            </button>

        </div>

        <div
            id="opcoes-parcelamento"
            class="opcoes-parcelamento">

            <label for="parcelas">
                Escolha o número de parcelas:
            </label>

            <select id="parcelas" onchange="atualizarParcela()"></select>

        </div>

        <div class="pagamento-resumo">

            <p>
                Forma de pagamento:
                <strong id="forma-escolhida">
                    Selecione uma opção
                </strong>
            </p>

            <p id="texto-parcela"></p>

            <p class="valor-final">
                Total: R$
                <span id="valor-pagamento">0,00</span>
            </p>

        </div>

        <button
            class="btn-confirmar"
            onclick="confirmarPagamento()">

            Confirmar pagamento

        </button>

        <button
            class="btn-cancelar"
            onclick="fecharPagamento()">

            Voltar

        </button>

    </section>

    <script src="script.js"></script>

</body>

</html>
